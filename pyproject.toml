[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "celerywatch"
version = "0.1.0"
description = "A terminal-based Celery monitoring and debugging tool."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Semere Abera", email = "semeabe@gmail.com" }
]
dependencies = [
    "celery>=5.5.2",
    "textual>=3.2.0",
    "rich>=14.0.0",
    "redis>=6.0.0"
]

[project.scripts]
celerywatch = "celerywatch.cli:main"

[tool.setuptools]
packages = ["celerywatch", "celerywatch.widgets", "celerywatch.models"]

[tool.setuptools.package-data]
"celerywatch" = ["styles/*.tcss"]
